[package]
name = "lanlink-quic"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "lanlink_quic"
crate-type = ["cdylib", "rlib"]

[dependencies]
quiche = "=0.30.0"
boring = "=5.2.0"
serde_json = "1"
base64 = "0.22"
rcgen = "0.13"
sha2 = "0.10"
rand = "0.8"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
