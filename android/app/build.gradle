plugins { id 'com.android.application' }
def releaseSigningFile = rootProject.file('../.tools/android-release/signing.properties')
def releaseSigning = new Properties()
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
android {
    namespace 'com.lanlink.app'
    compileSdk 35
    defaultConfig { applicationId 'com.lanlink.app'; minSdk 29; targetSdk 35; versionCode 92; versionName '0.91.1'; testInstrumentationRunner 'com.lanlink.app.PermissionFlowTest' }
    signingConfigs {
        release {
            if (releaseSigningFile.exists()) {
                storeFile new File(releaseSigningFile.parentFile, releaseSigning.getProperty('storeFile'))
                storeType releaseSigning.getProperty('storeType', 'PKCS12')
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
        debug {
            // Reuse this workspace's existing test signer so Studio can update the
            // previously supplied debug APK without uninstalling its local account.
            def localStore = rootProject.file('../.tools/android-debug.p12')
            if (localStore.exists()) {
                storeFile localStore
                storeType 'PKCS12'
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
}

// Embed the same source identity as the desktop packages on every build.
def generateBuildIdentity = tasks.register('generateBuildIdentity', Exec) {
    workingDir rootProject.file('..')
    commandLine(System.getenv('LANLINK_NODE') ?: 'node', 'scripts/build-info.js')
}
tasks.named('preBuild').configure { dependsOn(generateBuildIdentity) }

// Package the same curated language catalog used by both desktop clients.
def generateLanguageAssets = tasks.register('generateLanguageAssets', Copy) {
    from(rootProject.file('../src/locales.json'))
    from(rootProject.file('../src/assets/adb-connect.svg'))
    into(layout.buildDirectory.dir('generated/languageAssets'))
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/languageAssets'))
tasks.named('preBuild').configure { dependsOn(generateLanguageAssets) }
